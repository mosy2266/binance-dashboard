spring.application.name=binance-backend

spring.config.import=optional:file:.env.local[.properties]

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

binance.symbols=BTCUSDT,ETHUSDT
binance.rest-base-url=https://api.binance.com
binance.ws-base-url=wss://stream.binance.com:9443
binance.backfill.default-lookback-days=90
binance.backfill.request-delay-ms=250
binance.backfill.page-limit=1000
binance.backfill.max-retries=3
binance.gap-scan.fixed-delay-minutes=10
binance.gap-scan.staleness-threshold-minutes=2
